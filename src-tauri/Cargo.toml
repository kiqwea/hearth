[package]
name = "hearth"
version = "0.4.0"
description = "Hearth: локальные серверы Minecraft в пару кликов"
authors = ["Hearth"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
futures-util = "0.3.34"
thiserror = "2.0.21"
tracing = "0.1.44"
hex = "0.4.3"
sysinfo = "0.40.4"
dirs = "7.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
sha1 = "0.11.0"
sha2 = "0.11.1"
tauri-plugin-single-instance = "2.5.5"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "chrono-impl", "uuid-impl"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2", "gzip", "system-proxy", "query"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
md-5 = "0.11.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3.27.0"
